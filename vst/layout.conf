# Vibe FX -- multi-effect insert. Two pages: DRIVE+CHORUS front-end, REVERB+DELAY parallel sends.

theme_bg=d3d3d3
theme_panel=e0e0e0
theme_line=9c9c9c
theme_ink=1c1c1c
theme_ink_dim=5c5c5c
theme_ink_faint=919191
theme_accent=0a97ad
theme_accent_hi=b32e86
theme_knob_face=161616
theme_knob_ring=7e7e7e
theme_knob_dot=ffffff
theme_bar=c5c5c5
theme_tab_on=0a97ad
theme_tab_on_tx=ffffff
theme_btn_text=1b1c1d
theme_seg_active=0a97ad
theme_seg_inactive=c7c7c7
theme_seg_active_tx=ffffff
theme_lcd=eaeaea
art_css=skin.css
knob_look=moog
slider_look=fader

[tab DRIVE / CHORUS]
frame x=10 y=92 w=400 h=304 title="DRIVE"
knob cx=210 cy=222 r=48 label="DRIVE" key=drive
frame x=420 y=92 w=848 h=304 title="CHORUS"
knob cx=560 cy=222 r=44 label="RATE" key=chorusRate
knob cx=840 cy=222 r=44 label="DEPTH" key=chorusDepth
knob cx=1120 cy=222 r=44 label="CHORUS" key=chorusMix
qlinks "DRIVE / CHORUS" = drive,chorusRate,chorusDepth,chorusMix

[tab REVERB / DELAY]
frame x=10 y=92 w=1258 h=304 title="REVERB (SEND)"
knob cx=140 cy=222 r=44 label="DECAY" key=reverbDecay
knob cx=390 cy=222 r=44 label="DAMPING" key=reverbDamping
knob cx=640 cy=222 r=44 label="HI-PASS" key=reverbHipass
knob cx=890 cy=222 r=44 label="PREDELAY" key=reverbPredelay
knob cx=1140 cy=222 r=44 label="SEND" key=reverbSend
frame x=10 y=404 w=1258 h=304 title="DELAY (SEND)"
knob cx=140 cy=556 r=44 label="TIME" key=delayTime
knob cx=390 cy=556 r=44 label="FEEDBACK" key=delayFeedback
enum_h cx=640 cy=500 label="SYNC" key=delaySync options="FREE,SYNC" sw=64
popup cx=640 cy=600 w=150 h=44 label="DIVISION" key=delayDiv
knob cx=890 cy=556 r=44 label="TONE" key=delayTone
knob cx=1140 cy=556 r=44 label="SEND" key=delaySend
qlinks "REVERB / DELAY" = reverbDecay,reverbDamping,reverbHipass,reverbPredelay,reverbSend,delayTime,delayFeedback,delaySync,delayDiv,delayTone,delaySend
